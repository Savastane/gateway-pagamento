syntax = "proto3";

package paymentgateway.v1;

// Contract implemented by every payment provider service
// (stripe, appmax, asaas, mercadopago). See planejamento/plano-api-pagamento.md.
service PaymentGateway {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc CancelPayment(CancelPaymentRequest) returns (CancelPaymentResponse);
  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentResponse);
  rpc ParseWebhook(ParseWebhookRequest) returns (ParseWebhookResponse);
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_REQUIRES_ACTION = 2;
  PAYMENT_STATUS_AUTHORIZED = 3;
  PAYMENT_STATUS_PAID = 4;
  PAYMENT_STATUS_FAILED = 5;
  PAYMENT_STATUS_CANCELED = 6;
  PAYMENT_STATUS_EXPIRED = 7;
  PAYMENT_STATUS_REFUNDED = 8;
  PAYMENT_STATUS_PARTIALLY_REFUNDED = 9;
}

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CARD = 1;
  PAYMENT_METHOD_PIX = 2;
}

// Money is always expressed in the smallest currency unit
// (cents for BRL/USD). Never floating point.
message Money {
  int64 amount_minor = 1;
  string currency = 2; // ISO 4217, lowercase
}

message Customer {
  string name = 1;
  string email = 2;
  string tax_id = 3; // CPF or CNPJ — required for PIX
  string phone = 4;  // required by some providers (Appmax)
  string ip = 5;     // client IP collected client-side; required by Appmax (antifraud)
}

// Card payments must arrive already tokenized by the provider's
// client-side SDK (e.g. Stripe `pm_...`/`tok_...`). Never send PAN/CVV.
message CardMethod {
  string token = 1;
  int32 installments = 2; // number of installments; 0 or 1 = single payment
}

message PixMethod {
  // Seconds until the PIX code expires after confirmation.
  // 0 = provider default (Stripe: 4h; allowed range 60..1209600).
  int32 expires_after_seconds = 1;
}

message CreatePaymentRequest {
  string idempotency_key = 1; // required, up to 255 chars
  Money amount = 2;
  Customer customer = 3;
  oneof method {
    CardMethod card = 4;
    PixMethod pix = 5;
  }
  string return_url = 6; // required for redirect-based methods (PIX confirm)
  string description = 7;
  map<string, string> metadata = 8;
}

// QR data for the client to render when method = PIX.
message PixDetails {
  string emv_qr_code = 1;               // PIX "copia e cola" string
  string image_url_png = 2;
  string image_url_svg = 3;
  string hosted_instructions_url = 4;
  int64 expires_at = 5;                 // unix timestamp
  string qr_code_png_base64 = 6;        // providers that return raw image data (Appmax)
}

message Payment {
  string external_id = 1; // provider object id (Stripe: pi_...)
  PaymentStatus status = 2;
  Money amount = 3;
  PaymentMethod method = 4;
  PixDetails pix_details = 5; // present while a PIX payment is actionable
  string client_secret = 6;   // provider client secret, when available
  int64 created_at = 7;       // unix timestamp
}

message CreatePaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string external_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message CancelPaymentRequest {
  string external_id = 1;
  string idempotency_key = 2;
}

message CancelPaymentResponse {
  Payment payment = 1;
}

message RefundPaymentRequest {
  string external_id = 1;
  int64 amount_minor = 2; // 0 = full refund
  string idempotency_key = 3;
}

message RefundPaymentResponse {
  string refund_id = 1;
  PaymentStatus status = 2;
  Money amount = 3;
}

// The caller must forward the HTTP request verbatim: the raw body
// (bytes, never re-serialized) and the headers it received.
message ParseWebhookRequest {
  bytes payload = 1;
  map<string, string> headers = 2;
}

message ParseWebhookResponse {
  string event_id = 1;
  string event_type = 2;       // provider event type, e.g. payment_intent.succeeded
  string external_id = 3;      // id of the affected provider object
  string object_kind = 4;      // payment_intent | charge | refund | ...
  PaymentStatus status = 5;    // normalized status, when derivable
  bytes payload = 6;           // original event, echoed for storage
}
